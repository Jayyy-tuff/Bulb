<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#06070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Bulb</title>
<style>
:root{
  --bg:#06070f; --bg2:#0b0d1c; --glass:rgba(22,26,52,.55); --glass2:rgba(34,40,78,.55);
  --line:rgba(140,160,255,.16); --line2:rgba(140,160,255,.28);
  --text:#eef1ff; --dim:#9aa3c7; --mute:#646d93;
  --amber:#ffd23f; --cyan:#3ff0ff; --pink:#ff3fa4; --green:#4dffa0; --red:#ff5a6e;
  --r:18px; --r2:12px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;overscroll-behavior:none}
body{background:
  radial-gradient(900px 500px at 85% -10%,rgba(255,210,63,.13),transparent 60%),
  radial-gradient(800px 600px at -10% 30%,rgba(63,240,255,.10),transparent 60%),
  radial-gradient(700px 500px at 60% 110%,rgba(255,63,164,.10),transparent 60%),var(--bg);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(120,140,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.05) 1px,transparent 1px);
  background-size:36px 36px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
a.btn{text-decoration:none}
.hidden{display:none!important}
#app{position:relative;min-height:100%;padding:calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b));max-width:1100px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,210,63,.25),rgba(255,210,63,.05));border:1px solid rgba(255,210,63,.45);
  box-shadow:0 0 22px rgba(255,210,63,.35),inset 0 0 12px rgba(255,210,63,.2)}
.logo svg{width:22px;height:22px}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px;text-transform:uppercase}
.brand small{display:block;font-weight:500;letter-spacing:.04em;color:var(--dim);font-size:12px;text-transform:none}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);
  font-size:12px;color:var(--dim);white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.dot.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}

/* glass */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.card{padding:16px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:13px;margin:26px 2px 10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h3{margin:0 0 6px;font-size:16px}
.sub{color:var(--dim);font-size:13px;line-height:1.45}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:760px){.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}}
@media(max-width:759px){.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}}

/* buttons */
.btn{appearance:none;border:1px solid var(--line2);background:var(--glass2);color:var(--text);border-radius:14px;padding:12px 16px;min-height:46px;
  font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .2s,border-color .2s;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--amber),#ffb000);color:#1a1200;border-color:transparent;box-shadow:0 0 24px rgba(255,210,63,.35)}
.btn.cyan{background:linear-gradient(135deg,rgba(63,240,255,.25),rgba(63,240,255,.08));border-color:rgba(63,240,255,.5)}
.btn.danger{border-color:rgba(255,90,110,.5);color:#ffc0c8;background:rgba(255,90,110,.1)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:14px;padding:0;min-height:0}

/* forms */
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:12px;color:var(--dim);margin:0 2px 6px;letter-spacing:.04em}
.in,select.in,textarea.in{width:100%;background:rgba(5,7,18,.6);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;min-height:46px;outline:none}
.in:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,240,255,.15)}
textarea.in{min-height:90px;font-family:var(--mono);font-size:12.5px}
.seg{display:flex;padding:4px;gap:4px;border-radius:14px;background:rgba(5,7,18,.55);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--dim);font-weight:650;white-space:nowrap;min-height:40px}
.seg button.on{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2),0 0 16px rgba(63,240,255,.12)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line2);transition:.2s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd5f5;transition:.2s}
.sw input:checked+i{background:rgba(255,210,63,.3);border-color:var(--amber)}
.sw input:checked+i::after{left:25px;background:var(--amber);box-shadow:0 0 10px var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}

/* stats */
.stat{padding:14px;min-height:96px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:22px;font-weight:800}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));border-radius:9px}

/* library */
.tools{display:flex;gap:10px;margin:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{cursor:pointer;flex:none}
.chips .chip.on{color:var(--text);border-color:var(--amber);box-shadow:0 0 12px rgba(255,210,63,.25)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
@media(min-width:700px){.games{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.game{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;border:1px solid var(--line);background:#0c0f22;cursor:pointer;
  box-shadow:0 8px 30px rgba(0,0,0,.4);transition:transform .12s;touch-action:manipulation}
.game:active{transform:scale(.97)}
.game .art{position:absolute;inset:0;background-size:cover;background-position:center}
.game .gen{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:40px;letter-spacing:-.02em;color:rgba(255,255,255,.9);text-shadow:0 0 30px rgba(255,255,255,.35)}
.game .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(4,5,12,.95) 0%,rgba(4,5,12,.2) 45%,transparent 70%)}
.game .meta{position:absolute;left:10px;right:10px;bottom:10px}
.game .t{font-weight:750;font-size:14px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game .s{font-size:11px;color:var(--dim);margin-top:3px}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 7px;border-radius:7px;background:rgba(5,7,18,.75);border:1px solid var(--line2);text-transform:uppercase}
.badge.pc{color:var(--cyan);border-color:rgba(63,240,255,.5)}
.badge.web{color:var(--pink);border-color:rgba(255,63,164,.5)}
.badge.rom{color:var(--amber);border-color:rgba(255,210,63,.5)}
.empty{padding:28px 18px;text-align:center}
.empty .big{font-size:42px;margin-bottom:8px}
.recent{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent .game{flex:none;width:128px}

/* add */
.addopt{display:flex;gap:14px;align-items:center;padding:16px;cursor:pointer;margin-bottom:12px}
.addopt .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none;border:1px solid var(--line2)}
.uploads .u{padding:12px 14px;margin-top:10px}
.uploads .u .bar{margin-top:8px}

/* apps */
.app{padding:16px;display:flex;flex-direction:column;gap:12px}
.app .head{display:flex;gap:12px;align-items:center}
.app .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;border:1px solid var(--line2);flex:none}
.app .acts{display:flex;gap:8px;flex-wrap:wrap}
pre.log{max-height:260px;overflow:auto;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;font-family:var(--mono);white-space:pre-wrap;word-break:break-all;margin:0}

/* nav */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));z-index:30;display:flex;gap:4px;padding:6px;border-radius:24px;
  width:min(520px,calc(100% - 24px))}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;font-weight:650;min-height:54px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--text);background:rgba(255,255,255,.06)}
nav.tabs button.on svg{color:var(--amber);filter:drop-shadow(0 0 8px rgba(255,210,63,.7))}
nav.tabs button.add{color:#1a1200}
nav.tabs button.add .plus{width:46px;height:46px;border-radius:16px;margin-top:-2px;display:grid;place-items:center;background:linear-gradient(135deg,var(--amber),#ffb000);box-shadow:0 0 22px rgba(255,210,63,.5)}

/* sheet + modal */
.scrim{position:fixed;inset:0;background:rgba(2,3,10,.62);z-index:50;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + var(--safe-b));border-radius:24px 24px 0 0;
  max-width:760px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.2,1);background:rgba(14,17,36,.92)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:80;padding:12px 16px;border-radius:14px;max-width:calc(100% - 32px);font-size:14px;animation:up .2s}
.toast.err{border-color:rgba(255,90,110,.6)}
.launch{position:fixed;inset:0;z-index:90;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(600px 400px at 50% 40%,rgba(63,240,255,.15),transparent),rgba(3,4,12,.94)}
.ring{width:110px;height:110px;border-radius:50%;margin:0 auto 22px;border:3px solid rgba(63,240,255,.15);border-top-color:var(--cyan);border-right-color:var(--amber);animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(63,240,255,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{margin:18px auto 0;text-align:left;display:inline-block}
.steps div{padding:5px 0;color:var(--mute);font-size:14px}
.steps div.on{color:var(--text)}
.steps div.ok{color:var(--green)}
#frame{position:fixed;inset:0;z-index:95;background:#000}
#frame iframe{border:0;width:100%;height:100%}
#frame .back{position:fixed;top:calc(10px + var(--safe-t));left:10px;z-index:96;opacity:.55}
#frame .back:active{opacity:1}

/* auth */
.auth{max-width:420px;margin:12vh auto 0;padding:26px}
.auth .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 18px}
.auth .logo svg{width:36px;height:36px}
.center{text-align:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-weight:600;font-size:13px;word-break:break-all;text-align:right}
details.acc{margin-bottom:10px}
details.acc>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"›";margin-left:auto;color:var(--dim);font-size:22px;transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc .body{padding:0 16px 16px}
.browser{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.browser div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;word-break:break-all}
.browser div:active{background:rgba(255,255,255,.05)}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
</style>
<style>
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0a0b14;flex:none;font-size:15px;cursor:pointer;box-shadow:0 0 14px rgba(255,255,255,.12)}
.game.dim .art,.game.dim .gen{filter:grayscale(.75) brightness(.55)}
.game .getbtn{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:4px 7px;border-radius:7px;background:rgba(63,240,255,.2);border:1px solid rgba(63,240,255,.6);color:var(--cyan);letter-spacing:.06em}
.game .prog{position:absolute;left:10px;right:10px;bottom:50px}
.badge.steam{color:#9ad1ff;border-color:rgba(102,192,244,.6)}
.badge.epic{color:#fff;border-color:rgba(255,255,255,.5)}
.badge.sys{color:var(--green);border-color:rgba(77,255,160,.5)}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;margin:14px 0;border-color:rgba(63,240,255,.45)!important;box-shadow:0 0 30px rgba(63,240,255,.12)}
.banner .pulse{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(63,240,255,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(63,240,255,0)}100%{box-shadow:0 0 0 0 rgba(63,240,255,0)}}
.urow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.code{font-family:var(--mono);font-size:18px;letter-spacing:.12em;color:var(--amber)}
.section-title{display:flex;align-items:center;gap:10px;margin:20px 2px 10px}
.section-title h3{margin:0;font-size:15px}
.section-title .sp{flex:1}
.store-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:9.5px;letter-spacing:.04em;flex:none;border:1px solid var(--line2)}
.authtabs{margin:16px 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
"use strict";
(() => {
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = n => { if (!n && n !== 0) return "—"; const u = ["B","KB","MB","GB","TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; };
const fmtUp = s => { if (!s) return "—"; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m"; };
const ago = t => { if (!t) return ""; const s = Date.now() / 1000 - t; return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const IN_APP = !!window.BulbNative || /BulbApp/.test(navigator.userAgent);

const BULB = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffd23f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/><path d="M12 7l-1.5 3h3L12 13" stroke="#3ff0ff"/></svg>`;
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  lib: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>'
};
const GRADS = [["#ff3fa4","#6b2cff"],["#3ff0ff","#2457ff"],["#ffd23f","#ff5a1f"],["#4dffa0","#0a8f8f"],["#b05cff","#ff3fa4"],["#ff8a3f","#ff3f5e"],["#3fa4ff","#3ff0c8"]];
const hashStr = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const initials = t => String(t).replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
const SHADERS = ["", "crt-easymode.glslp", "crt-geom.glslp", "crt-aperture.glslp", "crt-mattias.glslp", "2xScaleHQ.glslp", "4xScaleHQ.glslp"];

async function api(path, opts = {}) {
  const o = { method: opts.method || (opts.body !== undefined ? "POST" : "GET"), headers: {}, credentials: "same-origin" };
  if (opts.body !== undefined) { o.body = JSON.stringify(opts.body); o.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, o);
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && !path.startsWith("/api/auth")) { S.user = null; render(); throw new Error(j.error || "Sign in first"); }
  if (!r.ok) { const e = new Error(j.error || ("Error " + r.status)); e.status = r.status; e.data = j; throw e; }
  return j;
}
function upload(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("PUT", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress && onProgress(e.loaded / e.total);
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status < 300 ? resolve(j) : reject(new Error(j.error || ("Upload failed (" + x.status + ")"))); };
    x.onerror = () => reject(new Error("Upload failed — connection dropped."));
    x.send(file);
  });
}

function sheet(html, onMount) {
  const layer = $("#layer");
  layer.innerHTML = `<div class="scrim"></div><div class="sheet glass"><div class="grab"></div>${html}</div>`;
  const close = () => { layer.innerHTML = ""; };
  $(".scrim", layer).onclick = close;
  let y0 = null; const sh = $(".sheet", layer);
  sh.addEventListener("touchstart", e => { if (sh.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchmove", e => { if (y0 != null && e.touches[0].clientY - y0 > 90) { y0 = null; close(); } }, { passive: true });
  $$("[data-close]", layer).forEach(b => b.onclick = close);
  onMount && onMount(sh, close);
  return close;
}

  });
}
function toPng(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("Couldn't convert image")), "image/png");
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("That file isn't an image the browser can read."));
    img.src = URL.createObjectURL(file);
  });
}

async function playLocal(g) {
  if (g.kind === "rom") { location.href = "/play?id=" + encodeURIComponent(g.id); return; }
  try {
    const p = await api(`/api/games/${g.id}/play`);
    const f = document.createElement("div");
    f.id = "frame";
    f.innerHTML = `<iframe src="${esc(p.url)}" allow="fullscreen; gamepad; autoplay; accelerometer; gyroscope" allowfullscreen></iframe><button class="btn sm glass back">✕ Exit</button>`;
    document.body.appendChild(f);
    const exit = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); try { screen.orientation.unlock(); } catch (e) {} if (window.BulbNative) window.BulbNative.setOrientation("any"); f.remove(); refreshLibrary(); };
    $(".back", f).onclick = exit;
    if (window.BulbNative) window.BulbNative.setOrientation(p.orientation || "any");
    try { await f.requestFullscreen({ navigationUI: "hide" }); if (p.orientation !== "any") await screen.orientation.lock(p.orientation); } catch (e) {}
  } catch (e) { fail(e); }
}

function bindAdd() {
  const sh = $("#add-share"); if (sh) sh.onchange = () => { S.shareUploads = sh.checked; };

function queueRoms(files, shared) {
  const next = () => {
    const f = files.shift(); if (!f) return;
    const s = guessSys(f.name);
    const send = sys => { doUpload(f, `/api/upload/rom?system=${sys}&name=${encodeURIComponent(f.name)}${shared}`); next(); };
    s ? send(s) : pickSystem(f.name, "Which console is this game for?", send, next);
  };
  next();
}
function pickSystem(fname, title, cb, skip) {
  sheet(`<h1 style="font-size:20px">${esc(title)}</h1><div class="sub">${esc(fname)}</div><div class="grid2" style="margin-top:14px">${Object.entries(S.systemNames).map(([k, v]) => `<button class="btn" data-sys="${k}">${esc(v)}</button>`).join("")}</div><button class="btn ghost block" style="margin-top:12px" data-close>Skip</button>`, (sh, close) => {
    $$("[data-sys]", sh).forEach(b => b.onclick = () => { close(); cb(b.dataset.sys); });

  });
}
function doUpload(file, url, after) {
  const u = { name: file.name, pct: 0, status: "Uploading " + fmtBytes(file.size) };
  S.uploads.unshift(u); if (S.tab === "add") render();
  let last = 0;
  upload(url, file, p => { u.pct = Math.round(p * 100); if (p >= 1) u.status = "Unpacking on the cloud…"; if (Date.now() - last > 300 && S.tab === "add") { last = Date.now(); render(); } })
    .then(async g => { u.pct = 100; u.status = "Added ✓"; await refreshLibrary(); after && after(g); })
    .catch(e => { u.status = "Failed: " + e.message; render(); fail(e); });
}

  $$("[data-sm]").forEach(b => b.onclick = async () => { try { S.admin.settings = await api("/api/admin/settings", { method: "PUT", body: { signup: b.dataset.sm } }); render(); toast("Sign-up mode saved."); } catch (e) { fail(e); } });
  $("#inv-new").onclick = async () => { try { const i = await api("/api/admin/invites", { body: { uses: +$("#inv-uses").value, days: +$("#inv-days").value, role: $("#inv-role").value } }); await loadAdmin(); share(`${location.origin}/#join=${i.code}`, i.code); } catch (e) { fail(e); } };
  $$("[data-icopy]").forEach(b => b.onclick = () => share(b.dataset.icopy));
  $$("[data-idel]").forEach(b => b.onclick = async () => { try { await api(`/api/admin/invites/${b.dataset.idel}`, { method: "DELETE" }); loadAdmin(); } catch (e) { fail(e); } });
  $("#cl-save").onclick = async () => { try { S.admin.settings = await api("/api/admin/settings", { method: "PUT", body: { name: $("#cl-name").value } }); S.name = S.admin.settings.name; toast("Saved."); render(); } catch (e) { fail(e); } };
  const power = action => async () => {
    if (!confirm(action === "restart" ? "Restart Bulb OS? Everyone is disconnected for a minute or two." : "Shut down Bulb OS? You'll need to start the VM again to use it.")) return;
    try { await api("/api/admin/power", { body: { action } }); toast(action === "restart" ? "Restarting… refresh in a minute." : "Shutting down."); } catch (e) { fail(e); }
  };
  const r = $("#pw-restart"); if (r) r.onclick = power("restart");
  const o = $("#pw-off"); if (o) o.onclick = power("shutdown");
}
async function share(link, code) {
  try { if (navigator.share) { await navigator.share({ title: "Join " + S.name, text: `Join my Bulb game cloud${code ? " — invite code " + code : ""}`, url: link }); return; } } catch (e) {}
  try { await navigator.clipboard.writeText(link); toast("Invite link copied."); } catch (e) { prompt("Copy this invite link:", link); }
}
function userSheet(u) {
  sheet(`
    <div class="row">${avatar(u, 52)}<div class="grow"><h1 style="font-size:22px;margin:0">${esc(u.display)}</h1><div class="sub">@${esc(u.username)} · ${esc(u.role)}</div></div></div>
    <div style="margin-top:12px">
      <div class="toggle"><div>Can play PC games</div><label class="sw"><input type="checkbox" id="u-pc" ${u.canPC ? "checked" : ""}><i></i></label></div>
      <div class="toggle"><div>Can upload games</div><label class="sw"><input type="checkbox" id="u-up" ${u.canUpload ? "checked" : ""}><i></i></label></div>
      <div class="toggle"><div><div>Disabled</div><div class="sub">Signs them out and blocks sign-in</div></div><label class="sw"><input type="checkbox" id="u-dis" ${u.disabled ? "checked" : ""}><i></i></label></div>
    </div>
    <label class="f"><span>SET A NEW PASSWORD (OPTIONAL)</span><input class="in" id="u-pw" type="password" autocomplete="new-password"></label>
    <button class="btn primary block" style="margin-top:14px" id="u-save">Save</button>
    <button class="btn danger block" style="margin-top:10px" id="u-del">Remove ${esc(u.display)}</button>
    <div class="sub" style="margin-top:8px">Removing someone deletes their saves. Games they uploaded are kept and handed to you.</div>`, (sh, close) => {
    $("#u-save", sh).onclick = async () => { try { const body = { canPC: $("#u-pc", sh).checked, canUpload: $("#u-up", sh).checked, disabled: $("#u-dis", sh).checked }; if ($("#u-pw", sh).value) body.password = $("#u-pw", sh).value; await api(`/api/admin/users/${u.id}`, { method: "PATCH", body }); toast("Saved."); close(); loadAdmin(); } catch (e) { fail(e); } };
    $("#u-del", sh).onclick = async () => { if (!confirm(`Remove ${u.display} from ${S.name}?`)) return; try { await api(`/api/admin/users/${u.id}`, { method: "DELETE" }); toast("Removed."); close(); loadAdmin(); } catch (e) { fail(e); } };
  });
}

// ---------------------------------------------------------------------------
(async () => {
  const h = location.hash.slice(1);
  if (h.startsWith("join=")) { S.joinCode = decodeURIComponent(h.slice(5)).toUpperCase(); S.authMode = "signup"; }
  else if (h) S.tab = h;
  try {
    const st = await api("/api/status");
    S.setup = st.setup; S.signup = st.signup; S.name = st.name || "Bulb"; S.user = st.user; S.ready = true;
    if (S.user && S.joinCode) toast("You're already signed in.");
    if (S.user) { await loadAll(); if (S.tab !== "home") go(S.tab); } else render();
  } catch (e) { S.ready = true; render(); fail(e); }
  setInterval(() => { if (S.user && !document.hidden) loadSys(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.user) { loadSys(); refreshLibrary().catch(() => {}); } });
})();
})();
</script>
